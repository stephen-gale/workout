<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arm Split">
  <title>Arm Split</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
    @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-display: swap; src: url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2"); }
    @font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url(fonts/barlow-latin-400-normal.woff2) format("woff2"); }
    @font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url(fonts/barlow-latin-500-normal.woff2) format("woff2"); }
    :root {
      --bg: #f6f6f4;
      --card: #ffffff;
      --text: #17181a;
      --muted: #7a7d82;
      --line: #e3e3e0;
      --accent: #2f6fed;
      --accent-text: #ffffff;
      --hint: #8a6d1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --card: #1b1c1f;
        --text: #f1f1ef;
        --muted: #8b8e94;
        --line: #2c2d31;
        --accent: #5b8cff;
        --accent-text: #0b0c0e;
        --hint: #d9b45a;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 480px; margin: 0 auto; }
    /* Display type: heavy, condensed, uppercase. */
    h1, h2, .daynum, .sets .n, .kg, .timer, button.complete {
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      text-transform: uppercase;
    }
    .daynum { color: var(--muted); font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .08em; }
    h1 { font-size: 52px; line-height: 1; font-weight: 800; margin: 4px 0 20px; letter-spacing: .01em; }
    .exercise {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 10px;
      margin-bottom: 14px;
    }
    .exercise h2 { font-size: 17px; line-height: 1.1; font-weight: 800; letter-spacing: .02em; margin: 0; align-self: end; }
    .exercise h2.pair { color: var(--muted); }
    .sets { display: grid; grid-template-columns: auto 1fr 1fr 1fr 1fr; gap: 6px 6px; align-items: center; }
    .sets .b { margin-left: 8px; }
    .sets > input.b { width: calc(100% - 8px); }
    .sets h2 { grid-column: span 2; }
    .sets .n { color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
    .sets .head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
    .sets > input { min-width: 0; padding: 10px 2px; font-size: 17px; text-align: center; }
    .sets > input.weight { border-color: var(--muted); }
    input {
      width: 100%;
      font: inherit;
      font-size: 18px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input::placeholder { color: var(--muted); opacity: .55; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button.complete {
      width: 100%;
      margin-top: 6px;
      padding: 16px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .06em;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-text);
    }
    button.complete:active { opacity: .85; }
    .reminder { text-align: center; color: var(--muted); font-size: 13px; margin: 18px 0 0; }
    .toast { text-align: center; font-size: 14px; color: var(--muted); min-height: 20px; margin: 0 0 6px; }
    .toast button, .tools button, .tools label {
      font: inherit; font-size: 13px; color: var(--accent);
      background: none; border: 0; padding: 4px 6px; cursor: pointer;
    }
    .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; margin-top: 28px; }
    .tools input[type=file] { display: none; }
    .sync { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 0; min-height: 16px; }
    .sync.err { color: var(--hint); }
    /* First screen = workout + reminder; Mark complete sits below the fold so it can't be hit by accident. */
    .screen {
      min-height: calc(100svh - env(safe-area-inset-top) - 20px);
      display: flex; flex-direction: column;
    }
    .screen .foot { margin-top: auto; padding: 8px 0 12px; }
    .screen .reminder { margin: 0; }
    .below { padding-top: 24px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .timer {
      flex: none; margin-top: 4px;
      min-width: 108px; padding: 9px 14px;
      font-size: 18px; font-weight: 800; letter-spacing: .05em; font-variant-numeric: tabular-nums;
      border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); color: var(--text);
    }
    .timer.running { border-color: var(--accent); color: var(--accent); }
    .timer.over { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  </style>
</head>
<body>
<main>
  <div class="screen">
    <header>
      <div>
        <p class="daynum" id="daynum"></p>
        <h1 id="dayname"></h1>
      </div>
      <button class="timer" id="timer">Rest 60s</button>
    </header>
    <div id="exercises"></div>
    <div class="foot">
      <p class="toast" id="toast"></p>
      <p class="reminder">3 × 12 each · 60s rest · 1–2 reps left in the tank</p>
    </div>
  </div>
  <div class="below">
    <button class="complete" id="complete">Mark complete</button>
  <div class="tools">
    <button id="export-csv">Export log (CSV)</button>
    <button id="backup">Back up</button>
    <label>Restore<input type="file" id="restore" accept="application/json,.json"></label>
    <button id="sync-setup">GitHub sync</button>
  </div>
  <p class="sync" id="sync"></p>
  </div>
</main>

<script>
  // Each day is two supersets: the main lift, then a forearm exercise straight after.
  const WRIST = 'Wrist curl (palms up)';
  const REVERSE_CURL = 'Reverse curl (palms down)';
  const PLAN = [
    { name: 'Biceps',  supersets: [['Incline dumbbell curl', REVERSE_CURL], ['Hammer curl', WRIST]] },
    { name: 'Triceps', supersets: [['Seated overhead dumbbell extension', REVERSE_CURL], ['Lying dumbbell skull crusher', WRIST]] },
  ];
  const exercisesOf = day => day.supersets.flat();
  // Short labels for the screen; the log keeps the full names.
  const SHORT = {
    'Incline dumbbell curl': 'Incline DB Curl',
    'Hammer curl': 'Hammer Curl',
    'Seated overhead dumbbell extension': 'Overhead DB Ext',
    'Lying dumbbell skull crusher': 'DB Skull Crusher',
    [WRIST]: 'Wrist Curl',
    [REVERSE_CURL]: 'Rev Curl',
  };
  const label = ex => SHORT[ex] || ex;
  const SETS = 3;
  const KEY = 'armsplit:v1';

  // state = { day: 0|1|2, log: [{ date, day, exercise, set, weight, reps }], draft: { [exercise]: { weights: [], reps: [] } } }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.log)) return { day: (s.day || 0) % PLAN.length, log: s.log, draft: s.draft || {} };
    } catch (e) {}
    return { day: 0, log: [], draft: {} };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  let state = load();
  let undoState = null;

  // Most recent session for an exercise: { weights: [w1, w2, w3], reps: [r1, r2, r3] }
  function lastTime(exercise) {
    const entries = state.log.filter(e => e.exercise === exercise);
    if (!entries.length) return null;
    const date = entries[entries.length - 1].date;
    const sets = entries.filter(e => e.date === date);
    const weights = [], reps = [];
    sets.forEach(e => { weights[e.set - 1] = e.weight; reps[e.set - 1] = e.reps; });
    return { weights, reps };
  }

  function fmtNum(n) { return Number.isInteger(n) ? String(n) : String(+n.toFixed(2)); }

  function draftFor(ex) {
    const d = state.draft[ex];
    if (!d || Array.isArray(d)) return (state.draft[ex] = { weights: [], reps: [] });
    // Older drafts had one weight per exercise; copy it to every set.
    if (!d.weights) { d.weights = d.weight ? Array(SETS).fill(d.weight) : []; delete d.weight; }
    return d;
  }

  function render() {
    const day = PLAN[state.day];
    document.getElementById('daynum').textContent = `Day ${state.day + 1} of ${PLAN.length}`;
    document.getElementById('dayname').textContent = day.name;
    const wrap = document.getElementById('exercises');
    wrap.innerHTML = '';
    day.supersets.forEach(pair => {
      const card = document.createElement('section');
      card.className = 'exercise';
      const grid = document.createElement('div');
      grid.className = 'sets';
      card.appendChild(grid);
      // Last time's numbers appear only as placeholders; nothing is filled in for you.
      const cols = pair.map(ex => ({ ex, last: lastTime(ex), draft: draftFor(ex) }));

      grid.appendChild(document.createElement('span'));
      cols.forEach(({ ex }, c) => {
        const h = document.createElement('h2');
        h.textContent = (c ? '+ ' : '') + label(ex);
        h.className = c ? 'pair b' : '';
        grid.appendChild(h);
      });

      grid.appendChild(document.createElement('span'));
      cols.forEach((_, c) => {
        ['kg', 'reps'].forEach((label, k) => {
          const el = document.createElement('span');
          el.className = 'head' + (c && !k ? ' b' : '');
          el.textContent = label;
          grid.appendChild(el);
        });
      });

      for (let i = 0; i < SETS; i++) {
        const n = document.createElement('span');
        n.className = 'n';
        n.textContent = `Set ${i + 1}`;
        grid.appendChild(n);
        cols.forEach(({ ex, last, draft }, c) => {
          const pw = last && last.weights[i], pr = last && last.reps[i];
          const w = makeInput('decimal', pw != null ? fmtNum(pw) : '', draft.weights[i], v => { draft.weights[i] = v; });
          w.classList.add('weight');
          if (c) w.classList.add('b');
          w.dataset.ex = ex;
          w.dataset.set = i;
          w.setAttribute('aria-label', `${ex} set ${i + 1} weight (kg)`);
          const r = makeInput('numeric', pr != null ? String(pr) : '', draft.reps[i], v => { draft.reps[i] = v; });
          r.setAttribute('aria-label', `${ex} set ${i + 1} reps`);
          grid.append(w, r);
        });
      }
      wrap.appendChild(card);
    });
  }

  function makeInput(mode, placeholder, value, onChange) {
    const el = document.createElement('input');
    el.type = 'number';
    el.inputMode = mode;
    el.step = mode === 'decimal' ? '0.25' : '1';
    el.min = '0';
    el.placeholder = placeholder;
    el.value = value ?? '';
    // Keep in-progress entries so closing the app mid-workout loses nothing.
    el.addEventListener('input', () => { onChange(el.value); save(); });
    return el;
  }

  function complete() {
    const day = PLAN[state.day];
    const date = new Date().toISOString();
    const entries = [];
    for (const ex of exercisesOf(day)) {
      const d = draftFor(ex);
      for (let i = 0; i < SETS; i++) {
        const weight = parseFloat(d.weights[i]);
        const reps = parseInt(d.reps[i], 10);
        if (!Number.isFinite(reps)) continue;
        if (!Number.isFinite(weight)) {
          alert(`Enter the weight for ${label(ex)}, set ${i + 1}.`);
          document.querySelector(`input.weight[data-ex="${CSS.escape(ex)}"][data-set="${i}"]`).focus();
          return;
        }
        entries.push({ date, day: day.name, exercise: ex, set: i + 1, weight, reps });
      }
    }
    if (!entries.length && !confirm(`Nothing entered. Mark ${day.name} complete anyway?`)) return;

    undoState = JSON.stringify(state);
    state.log.push(...entries);
    exercisesOf(day).forEach(ex => delete state.draft[ex]);
    state.day = (state.day + 1) % PLAN.length;
    save();
    render();
    window.scrollTo(0, 0);
    showToast(`${day.name} done.`, true);
    push();
  }

  function showToast(msg, withUndo) {
    const t = document.getElementById('toast');
    t.textContent = msg + ' ';
    if (withUndo) {
      const b = document.createElement('button');
      b.textContent = 'Undo';
      b.onclick = () => {
        state = JSON.parse(undoState);
        undoState = null;
        save();
        render();
        t.textContent = '';
        push();
      };
      t.appendChild(b);
    }
  }

  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function today() { return new Date().toISOString().slice(0, 10); }

  function exportCsv() {
    const esc = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    const rows = [['date', 'day', 'exercise', 'set', 'weight_kg', 'reps']];
    state.log.forEach(e => rows.push([e.date, e.day, e.exercise, e.set, e.weight, e.reps]));
    download(`arm-split-log-${today()}.csv`, rows.map(r => r.map(esc).join(',')).join('\n') + '\n', 'text/csv');
  }

  function backup() {
    download(`arm-split-backup-${today()}.json`, JSON.stringify(state, null, 2), 'application/json');
  }

  function restore(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const s = JSON.parse(reader.result);
        if (!s || !Array.isArray(s.log)) throw new Error('bad file');
        if (!confirm(`Replace current data with backup (${s.log.length} logged sets)?`)) return;
        state = { day: (s.day || 0) % PLAN.length, log: s.log, draft: s.draft || {} };
        save();
        render();
        showToast('Backup restored.');
        push();
      } catch (e) {
        alert("That file doesn't look like an Arm Split backup.");
      }
    };
    reader.readAsText(file);
  }

  // Rest timer: counts down 60s, chimes, then counts up so you can see how far past you are.
  const REST = 60;
  const timerEl = document.getElementById('timer');
  let restEnd = null, tick = null, chimed = false, audio = null, wakeLock = null;

  function chime() {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    if (!audio) return;
    [0, 0.25].forEach(offset => {
      const o = audio.createOscillator(), g = audio.createGain();
      const t = audio.currentTime + offset;
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.22);
    });
  }

  function updateTimer() {
    const left = Math.ceil((restEnd - Date.now()) / 1000);
    const secs = Math.abs(left);
    const mmss = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    if (left > 0) {
      timerEl.textContent = mmss;
    } else {
      if (!chimed) { chimed = true; chime(); }
      timerEl.textContent = `Go · +${mmss}`;
      timerEl.classList.add('over');
    }
  }

  async function startTimer() {
    // Audio must be unlocked from a tap, so create it here.
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
    restEnd = Date.now() + REST * 1000;
    chimed = false;
    timerEl.classList.add('running');
    timerEl.classList.remove('over');
    updateTimer();
    tick = setInterval(updateTimer, 250);
  }

  function stopTimer() {
    clearInterval(tick);
    restEnd = null;
    try { wakeLock?.release(); } catch (e) {}
    wakeLock = null;
    timerEl.classList.remove('running', 'over');
    timerEl.textContent = `Rest ${REST}s`;
  }

  timerEl.addEventListener('click', () => restEnd ? stopTimer() : startTimer());
  document.addEventListener('visibilitychange', async () => {
    if (restEnd && document.visibilityState === 'visible') {
      updateTimer();
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
    }
  });

  document.getElementById('complete').addEventListener('click', () => { stopTimer(); complete(); });
  document.getElementById('export-csv').addEventListener('click', exportCsv);
  document.getElementById('backup').addEventListener('click', backup);
  document.getElementById('restore').addEventListener('change', e => {
    if (e.target.files[0]) restore(e.target.files[0]);
    e.target.value = '';
  });

  // Ask the browser not to evict our data when storage is tight.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  // GitHub sync: the log is committed to data/log.json in the repo, so clearing the
  // browser loses nothing. Needs a fine-grained token with Contents read/write on the repo.
  const SYNC_KEY = 'armsplit:sync';
  const REPO = 'stephen-gale/workout';
  const DATA_PATH = 'data/log.json';
  const API = `https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`;
  const syncEl = document.getElementById('sync');

  function syncConf() {
    try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; }
  }
  function setSyncConf(c) { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); }

  function syncStatus(msg, err) {
    syncEl.textContent = msg;
    syncEl.classList.toggle('err', !!err);
  }

  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  function b64decode(b64) {
    const bin = atob(b64.replace(/\n/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }

  async function gh(method, body) {
    const res = await fetch(API + (method === 'GET' ? '?ref=main' : ''), {
      method,
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${syncConf().token}`,
        Accept: 'application/vnd.github+json',
        ...(body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 404 && method === 'GET') return null;
    if (!res.ok) {
      const e = new Error(`GitHub ${res.status}`);
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  async function fetchRemote() {
    const file = await gh('GET');
    if (!file) return { sha: undefined, data: null };
    return { sha: file.sha, data: JSON.parse(b64decode(file.content)) };
  }

  const entryKey = e => `${e.date}|${e.exercise}|${e.set}`;

  // Pull: add any sets from GitHub that this device doesn't have yet.
  async function pull() {
    if (!syncConf().token) return;
    try {
      syncStatus('Syncing…');
      const { data } = await fetchRemote();
      if (data && Array.isArray(data.log)) {
        const have = new Set(state.log.map(entryKey));
        const extra = data.log.filter(e => !have.has(entryKey(e)));
        if (extra.length) {
          state.log = state.log.concat(extra).sort((a, b) => a.date.localeCompare(b.date));
          // The device that logged most recently knows which day is next.
          const remoteLatest = data.log.length ? data.log[data.log.length - 1].date : '';
          const localLatest = state.log.length ? state.log[state.log.length - 1].date : '';
          if (remoteLatest >= localLatest && Number.isInteger(data.day)) state.day = data.day % PLAN.length;
          save();
          render();
        }
      }
      if (syncConf().dirty) await push();
      else syncStatus('Synced with GitHub ✓');
    } catch (e) {
      syncStatus(syncError(e), true);
    }
  }

  // Push: write this device's log to GitHub (one commit per change).
  async function push() {
    const conf = syncConf();
    if (!conf.token) return;
    setSyncConf({ ...conf, dirty: true });
    syncStatus('Saving to GitHub…');
    const content = b64encode(JSON.stringify({ day: state.day, log: state.log }, null, 1) + '\n');
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const { sha } = await fetchRemote();
        await gh('PUT', {
          message: `Log workout ${new Date().toISOString().slice(0, 10)}`,
          content,
          sha,
          branch: 'main',
        });
        setSyncConf({ ...syncConf(), dirty: false });
        syncStatus('Saved to GitHub ✓');
        return;
      } catch (e) {
        if (e.status !== 409 && e.status !== 422) { syncStatus(syncError(e), true); return; }
      }
    }
    syncStatus('Not saved to GitHub yet — will retry', true);
  }

  function syncError(e) {
    if (e.status === 401) return 'GitHub token expired or wrong — tap GitHub sync';
    if (e.status === 403 || e.status === 404) return "GitHub token can't access the repo — tap GitHub sync";
    return 'Offline — will save to GitHub later';
  }

  document.getElementById('sync-setup').addEventListener('click', () => {
    const conf = syncConf();
    const token = prompt(
      conf.token
        ? 'GitHub sync is on. Paste a new token to replace it, or clear the box to turn sync off.'
        : `Paste a GitHub fine-grained token with Contents: read & write on ${REPO}.`,
      conf.token ? '••••' : ''
    );
    if (token === null || token === '••••') return;
    if (!token.trim()) { setSyncConf({}); syncStatus('GitHub sync off'); return; }
    setSyncConf({ token: token.trim(), dirty: true });
    pull();
  });

  window.addEventListener('online', pull);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && syncConf().dirty) push();
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  render();
